services:
    db:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        environment:
            POSTGRES_DB: stylefinder
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - database_dev:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d stylefinder"]
            interval: 10s
            timeout: 5s
            retries: 10
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    database_dev:
