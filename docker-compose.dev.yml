services:
    db:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        environment:
            POSTGRES_DB: stylefinder
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - database_dev:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d stylefinder"]
            interval: 10s
            timeout: 5s
            retries: 10
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # Catches every letter the local API sends: UI on http://localhost:8025.
    mailpit:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        environment:
            MP_MAX_MESSAGES: 500
        ports:
            - "127.0.0.1:1025:1025"
            - "127.0.0.1:8025:8025"
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped

volumes:
    database_dev:
