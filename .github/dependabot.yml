version: 2
updates:
  - package-ecosystem: npm
    directory: /next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-patches:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /nest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-patches:
        update-types: [patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /next
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /nest
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
