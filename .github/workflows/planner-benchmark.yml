name: Planner benchmark

# Measures the auto layout on the generated rooms against the recorded
# baseline. It takes minutes, so it runs only when the layout logic can change.
on:
  pull_request:
    paths:
      - next/src/shared/lib/furniture-planner/**
      - next/package-lock.json
      - .github/workflows/planner-benchmark.yml
  push:
    branches: [main]
    paths:
      - next/src/shared/lib/furniture-planner/**
      - next/package-lock.json
      - .github/workflows/planner-benchmark.yml

permissions:
  contents: read

concurrency:
  group: planner-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Planner benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: next/package-lock.json
      - run: npm ci
      - run: npm run planner:benchmark
      - name: Show the report
        if: always()
        run: cat test-results/planner-benchmark/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: planner-benchmark
          path: next/test-results/planner-benchmark/latest
          if-no-files-found: ignore
          retention-days: 14
