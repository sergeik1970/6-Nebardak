services:
    nest:
        build:
            context: ./nest
        tty: true
        env_file:
            - ./nest/.env
        environment:
            NODE_ENV: production
            DB_HOST: db
            DB_PORT: 5432
        ports:
            - "3001:3001"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped

    next:
        build:
            context: ./next
        tty: true
        env_file:
            - ./next/.env
        environment:
            NODE_ENV: production
        ports:
            - "80:3000"
        depends_on:
            nest:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:16
        env_file:
            - ./nest/.env
        volumes:
            - database:/var/lib/postgresql/data:delegated
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    database:
