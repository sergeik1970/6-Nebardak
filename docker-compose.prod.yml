services:
    nest:
        build:
            context: ./nest
        tty: true
        environment:
            NODE_ENV: production
            DB_HOST: db
            DB_PORT: 5432
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            JWT_SECRET: ${JWT_SECRET}
        expose:
            - "3001"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped

    next:
        build:
            context: ./next
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        tty: true
        environment:
            NODE_ENV: production
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        expose:
            - "3000"
        depends_on:
            nest:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - database:/var/lib/postgresql/data:delegated
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    caddy:
        image: caddy:2.11-alpine
        depends_on:
            next:
                condition: service_started
            nest:
                condition: service_healthy
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        environment:
            SITE_ADDRESS: ${SITE_ADDRESS}
            LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        restart: unless-stopped

volumes:
    database:
    caddy_data:
    caddy_config:
